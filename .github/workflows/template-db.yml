name: Refresh template database

# Weekly: rebuild data/known-templates.json from the official repos in data/template-sources.json
# and open a pull request when it changed, so new official templates reach the next release.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    permissions:
      contents: write       # push the automation branch
      pull-requests: write  # open the pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Rebuild database
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: dotnet run --project tools/TemplateDbBuilder -- --history
      - name: Check false positives on official templates
        run: dotnet test --filter "FullyQualifiedName~OfficialTemplateTests"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Renderer fidelity vs jinja2 on the top 1,000 GGUF repos
        run: |
          pip install jinja2
          dotnet run --project tools/TemplateCorpus -- 1000 --dump "$RUNNER_TEMP/corpus.json"
          python tools/render-fidelity/render_reference.py "$RUNNER_TEMP/corpus.json" > "$RUNNER_TEMP/corpus-ref.json"
          dotnet run --project tools/TemplateCorpus -- 1000 --compare "$RUNNER_TEMP/corpus-ref.json"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/template-db
          title: Refresh known chat templates
          commit-message: Refresh known chat templates
          body: Automated weekly rebuild of `data/known-templates.json` by `tools/TemplateDbBuilder`. Review new and changed templates before merging.
          add-paths: data/known-templates.json
