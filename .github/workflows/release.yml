name: Release

# Push a tag like v0.3.0 to build native binaries for every platform, the .NET tool package and packaging manifests,
# and attach them to a GitHub release with SHA256SUMS. When the repository is public, every asset also gets a
# build-provenance attestation and a Sigstore (cosign keyless) signature bundle. Both are skipped while it is private:
# attestations need a public repo (or GitHub Enterprise Cloud), and cosign keyless would publish the private repo's
# name and workflow in the public Rekor transparency log.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,    rid: win-x64,     exe: modelcheck.exe }
          - { os: windows-11-arm,    rid: win-arm64,   exe: modelcheck.exe }
          - { os: ubuntu-latest,     rid: linux-x64,   exe: modelcheck }
          - { os: ubuntu-24.04-arm,  rid: linux-arm64, exe: modelcheck }
          - { os: macos-latest,      rid: osx-arm64,   exe: modelcheck }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - run: dotnet publish src/ModelSafetyCheck.Cli -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
          EXE: ${{ matrix.exe }}
        run: |
          cd "publish/$RID"
          name="modelcheck-$TAG-$RID"
          # The executable works alone; the ONNX Runtime library is only needed for the optional --classifier.
          files="$EXE $(ls | grep -E '^(lib)?onnxruntime[^/]*\.(dll|so|dylib)$' | tr '\n' ' ')"
          # shellcheck disable=SC2086 # files is a list
          if [[ "$RID" == win-* ]]; then 7z a "../$name.zip" $files; else tar czf "../$name.tar.gz" $files; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: publish/modelcheck-*

  tool-package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Pack the .NET tool (dotnet tool install -g ModelSafetyCheck)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          dotnet pack src/ModelSafetyCheck.Cli -c Release -p:Version="$version" -o nupkg
          test -f "nupkg/ModelSafetyCheck.$version.nupkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: nupkg/*.nupkg

  release:
    needs: [build, tool-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # Sigstore keyless signing and attestations (public repo only)
      attestations: write
    env:
      PUBLIC: ${{ github.event.repository.visibility == 'public' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Packaging manifests (winget, Homebrew) with this release's hashes
        run: bash packaging/render.sh "$TAG" dist "${{ github.repository }}" dist/packaging
      - name: Checksums
        run: |
          cd dist
          (cd packaging && tar czf "../modelcheck-$TAG-packaging.tar.gz" .)
          rm -r packaging
          sha256sum modelcheck-* ModelSafetyCheck.*.nupkg > SHA256SUMS
          cat SHA256SUMS
      - name: Build provenance attestation
        if: env.PUBLIC == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/modelcheck-*
            dist/ModelSafetyCheck.*.nupkg
            dist/SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLIC == 'true'
      - name: Sign with cosign (keyless)
        if: env.PUBLIC == 'true'
        run: |
          cd dist
          for f in modelcheck-* ModelSafetyCheck.*.nupkg SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Verify what users will verify
        if: env.PUBLIC == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          identity="^https://github.com/$REPO/.github/workflows/release.yml@refs/tags/v"
          for f in modelcheck-* ModelSafetyCheck.*.nupkg SHA256SUMS; do
            [[ "$f" == *.sigstore.json ]] && continue
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            gh attestation verify "$f" --repo "$REPO"
          done
      - name: Private repository notice
        if: env.PUBLIC != 'true'
        run: echo "::notice::Repository is private, so the release has SHA256SUMS but no attestations or Sigstore signatures."
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
