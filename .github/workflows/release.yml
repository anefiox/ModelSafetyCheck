name: Release

# Push a tag like v0.2.0 to build native binaries for every platform and attach them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,    rid: win-x64,     exe: modelcheck.exe }
          - { os: windows-11-arm,    rid: win-arm64,   exe: modelcheck.exe }
          - { os: ubuntu-latest,     rid: linux-x64,   exe: modelcheck }
          - { os: ubuntu-24.04-arm,  rid: linux-arm64, exe: modelcheck }
          - { os: macos-latest,      rid: osx-arm64,   exe: modelcheck }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - run: dotnet publish src/ModelSafetyCheck.Cli -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}
      - name: Package
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          name=modelcheck-${{ github.ref_name }}-${{ matrix.rid }}
          # The executable works alone; the ONNX Runtime library is only needed for the optional --classifier.
          files="${{ matrix.exe }} $(ls | grep -E '^(lib)?onnxruntime[^/]*\.(dll|so|dylib)$' | tr '\n' ' ')"
          if [[ "${{ matrix.rid }}" == win-* ]]; then 7z a ../$name.zip $files; else tar czf ../$name.tar.gz $files; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: publish/modelcheck-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum modelcheck-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
