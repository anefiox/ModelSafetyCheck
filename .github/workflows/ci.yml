name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Reference renders from real jinja2
        shell: bash
        run: |
          pip install jinja2
          python tools/render-fidelity/render_reference.py > "$RUNNER_TEMP/jinja2-reference.json"
          echo "MODELCHECK_FIDELITY_FILE=$RUNNER_TEMP/jinja2-reference.json" >> "$GITHUB_ENV"
      - run: dotnet test --configuration Release
      - name: Open WebUI filter against the built CLI
        shell: bash
        run: |
          dotnet build src/ModelSafetyCheck.Cli -c Release -o "$RUNNER_TEMP/cli"
          exe="$RUNNER_TEMP/cli/modelcheck"; [[ -f "$exe.exe" ]] && exe="$exe.exe"
          MODELCHECK="$exe" python integrations/open-webui/test_modelcheck_filter.py
          echo "MODELCHECK=$exe" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: LM Studio plugin typecheck and tests
        working-directory: integrations/lmstudio-plugin
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test
